<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier Me｜メンバー自己紹介帳</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: #F7F3EE; color: #3A2A1E;
      min-height: 100vh; padding: 2rem 1rem 4rem;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 2.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid #E8DDD0; }
    .logo-label { font-size: 11px; letter-spacing: 0.15em; color: #B09A84; text-transform: uppercase; margin-bottom: 6px; }
    .logo-title { font-size: 40px; font-weight: 700; color: #6B4F3A; letter-spacing: 0.04em; margin: 0 0 4px; }
    .logo-sub { font-size: 13px; color: #A08878; }
    .rainbow-bar { display: flex; height: 4px; border-radius: 4px; overflow: hidden; margin: 14px auto 0; width: 120px; opacity: 0.7; }
    .rainbow-bar span { flex: 1; }
    .search-row { display: flex; gap: 10px; margin-bottom: 1.5rem; align-items: center; }
    .search-row input {
      flex: 1; border-radius: 30px; border: 1px solid #DDD0C4;
      background: #FAF7F3; padding: 9px 18px; font-size: 14px;
      color: #3A2A1E; outline: none; font-family: inherit;
    }
    .search-row input:focus { border-color: #C4A898; }
    .count { font-size: 12px; color: #B09A84; white-space: nowrap; letter-spacing: 0.05em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 28px; align-items: start; }
    .card { background: #FDFAF7; border-radius: 16px; border: 1px solid #E8DDD0; overflow: hidden; }
    .card-header { padding: 22px 22px 16px; border-bottom: 1px solid #EDE4DA; background: #FAF5EF; position: relative; }
    .accent-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; display: flex; }
    .accent-bar span { flex: 1; }
    .name-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .name { font-size: 20px; font-weight: 700; color: #5A3E2E; }
    .age { font-size: 12px; color: #B09A84; background: #F0E8E0; padding: 2px 8px; border-radius: 10px; }
    .meta { font-size: 12px; color: #A08878; margin: 0 0 10px; }
    .tag-group { margin-bottom: 8px; }
    .tag-group:last-child { margin-bottom: 0; }
    .tag-label { font-size: 10px; color: #B09A84; letter-spacing: 0.1em; margin-bottom: 4px; }
    .pills { display: flex; flex-wrap: wrap; gap: 5px; }
    .pill { font-size: 11px; padding: 2px 9px; border-radius: 20px; border: 1px solid #DDD0C4; color: #7A5C48; background: #FFF8F2; }
    .pill.ai { border-color: #C8D8EE; color: #4A6A8A; background: #F2F7FD; }
    .body { padding: 0; }
    .section { padding: 14px 22px; border-bottom: 1px solid #EDE4DA; }
    .section:last-child { border-bottom: none; }
    .sec-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #fff;
      background: #6B4F3A;
      border-radius: 20px;
      padding: 3px 11px;
      margin-bottom: 8px;
    }
    .sec-text { font-size: 13px; color: #5A4232; line-height: 1.85; white-space: pre-wrap; }
    .message-section { padding: 16px 22px 20px; background: #FFF8F2; border-top: 1px solid #EDE4DA; }
    .message-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #fff;
      background: #6B4F3A;
      border-radius: 20px;
      padding: 3px 11px;
      margin-bottom: 10px;
    }
    .message-text { font-size: 13px; color: #5A4232; line-height: 1.85; font-style: italic; white-space: pre-wrap; }
    .message-text::before { content: '\201C'; font-size: 22px; color: #D4A8C0; line-height: 0; vertical-align: -7px; margin-right: 2px; }
    .message-text::after { content: '\201D'; font-size: 22px; color: #D4A8C0; line-height: 0; vertical-align: -7px; margin-left: -2px; }
    .loading { text-align: center; padding: 4rem; color: #B09A84; font-size: 14px; }
    .error { text-align: center; padding: 2rem; color: #B09A84; font-size: 13px; background: #FAF5EF; border-radius: 12px; line-height: 1.8; }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      .logo-title { font-size: 26px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="logo-label">卒業生限定コミュニティ</div>
    <h1 class="logo-title">Atelier Me</h1>
    <div class="logo-sub">メンバー自己紹介帳</div>
    <div class="rainbow-bar">
      <span style="background:#E8837A"></span>
      <span style="background:#E8B07A"></span>
      <span style="background:#E8D87A"></span>
      <span style="background:#8DC87A"></span>
      <span style="background:#7AB8E8"></span>
      <span style="background:#7A85E0"></span>
      <span style="background:#B87AE0"></span>
    </div>
  </header>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="名前・キーワードで検索" oninput="filterCards()" />
    <span class="count" id="countLabel"></span>
  </div>
  <div id="cardGrid" class="grid">
    <div class="loading">メンバー情報を読み込み中…</div>
  </div>
</div>
<script>
  const SHEET_ID = '1r3KConc8_VX_ZZ1XTTR0JeRUzSRs3ZNEpzxY-jaeNQE';
  const COLORS = [
    ["#E8837A","#E8B07A","#E8D87A"],
    ["#8DC87A","#7AB8E8","#7A85E0"],
    ["#B87AE0","#E8837A","#E8B07A"],
    ["#7AB8E8","#8DC87A","#E8D87A"],
    ["#E8D87A","#B87AE0","#8DC87A"],
    ["#7A85E0","#E8837A","#7AB8E8"],
  ];
  let allMembers = [];

  async function loadSheet() {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const cols = json.table.cols.map(c => c.label);
    return json.table.rows
      .filter(row => row && row.c && row.c[0] && row.c[0].v)
      .filter(row => row.c[1] && row.c[1].v)
      .map(row => {
        const obj = {};
        cols.forEach((col, i) => {
          const cell = row.c[i];
          obj[col] = cell && cell.v !== null && cell.v !== undefined ? String(cell.v).trim() : '';
        });
        return obj;
      });
  }

  function esc(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function buildCard(m, i) {
    const colors = COLORS[i % COLORS.length];

    const name       = m['Discord名を教えてください'] || '';
    const age        = m['年代'] || '';
    const from       = m['出身地'] || '';
    const live       = m['住まい（現在地）'] || '';
    const workstyle  = m['現在の働き方は？'] || '';
    const joinDate   = m['図解デザイナー講座の入会時期は？（例：2025年4月）'] || '';
    const career     = m['これまでの職歴'] || '';
    const work       = m['現在の仕事内容は？'] || '';
    const aiRaw      = m['よく使うAI'] || '';
    const goalBefore = m['どんなこと目指して講座に入った？'] || '';
    const goalNow    = m['今はどんなことを目指していますか？'] || '';
    const trouble    = m['今の悩み、課題は？'] || '';
    const strength   = m['長所・得意なこと'] || '';
    const weakness   = m['短所・苦手なこと'] || '';
    const hobby      = m['趣味・好きなこと'] || '';
    const message    = m['Atelier Meのみんなへメッセージ'] || '';

    const aiTags   = aiRaw.split(/[,、，]/).map(s => s.trim()).filter(Boolean);
    const workTags = workstyle.split(/[,、，]/).map(s => s.trim()).filter(Boolean);

    const sections = [
      joinDate    && { label: '図解デザイナー講座入会時期',           text: joinDate },
      goalBefore  && { label: '入会当時の目標',                       text: goalBefore },
      career      && { label: 'これまでの職歴',                       text: career },
      work        && { label: '現在の仕事内容',                       text: work },
      goalNow     && { label: '今目指していること',                   text: goalNow },
      trouble     && { label: '今の悩み・課題',                       text: trouble },
      strength    && { label: '長所・得意なこと',                     text: strength },
      weakness    && { label: '短所・苦手なこと',                     text: weakness },
      hobby       && { label: '趣味・好きなこと',                     text: hobby },
    ].filter(Boolean);

    return `
      <article class="card">
        <div class="card-header">
          <div class="accent-bar">${colors.map(c=>`<span style="background:${c};opacity:0.65"></span>`).join('')}</div>
          <div class="name-row">
            <span class="name">${esc(name)}</span>
            ${age ? `<span class="age">${esc(age)}</span>` : ''}
          </div>
          <div class="meta">出身：${esc(from)}　→　現在：${esc(live)}</div>
          ${workTags.length ? `
          <div class="tag-group">
            <div class="tag-label">働き方</div>
            <div class="pills">${workTags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>
          </div>` : ''}
          ${aiTags.length ? `
          <div class="tag-group" style="margin-top:8px">
            <div class="tag-label">よく使うAI</div>
            <div class="pills">${aiTags.map(t=>`<span class="pill ai">${esc(t)}</span>`).join('')}</div>
          </div>` : ''}
        </div>
        <div class="body">
          ${sections.map(s=>`
          <div class="section">
            <div class="sec-label">${s.label}</div>
            <div class="sec-text">${esc(s.text)}</div>
          </div>`).join('')}
        </div>
        ${message ? `
        <div class="message-section">
          <div class="message-label">みんなへメッセージ</div>
          <div class="message-text">${esc(message)}</div>
        </div>` : ''}
      </article>`;
  }

  function renderCards(members) {
    const grid = document.getElementById('cardGrid');
    document.getElementById('countLabel').textContent = members.length + ' members';
    if (members.length === 0) {
      grid.innerHTML = '<div class="error">該当するメンバーが見つかりませんでした。</div>';
      return;
    }
    grid.innerHTML = members.map((m,i) => buildCard(m,i)).join('');
  }

  function filterCards() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = q
      ? allMembers.filter(m => Object.values(m).join(' ').toLowerCase().includes(q))
      : allMembers;
    renderCards(filtered);
  }

  (async () => {
    try {
      allMembers = await loadSheet();
      renderCards(allMembers);
    } catch(e) {
      console.error(e);
      document.getElementById('cardGrid').innerHTML =
        '<div class="error">データの読み込みに失敗しました。<br>スプレッドシートの共有設定を「リンクを知っている全員が閲覧可能」にしてください。</div>';
    }
  })();
</script>
</body>
</html>
